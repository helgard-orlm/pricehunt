<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pricehunt</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header>
  <div><b>pricehunt</b> <span class="mute" data-i18n="tagline"></span></div>
  <button class="icon" id="gear" data-i18n-title="gear_title">⚙</button>
</header>

<section id="setup" hidden>
  <h2 data-i18n="setup_h"></h2>
  <label data-i18n="language"></label>
  <select id="langsel"></select>
  <p class="mute small" data-i18n="setup_p"></p>
  <label data-i18n="address"></label>
  <input id="base" placeholder="http://localhost:11434">
  <button class="ghost" id="probe" data-i18n="check"></button>
  <div id="probeout" class="small"></div>
  <label data-i18n="model"></label>
  <select id="modelsel"></select>
  <details class="small"><summary data-i18n="apikey"></summary><input id="key" data-i18n-ph="optional"></details>
  <button id="savecfg" data-i18n="save"></button>
  <div class="help small" id="help" hidden data-i18n-html="help_html"></div>
</section>

<section id="product">
  <div id="noproduct" class="mute" data-i18n="noproduct"></div>
  <div id="pcard" hidden>
    <div class="row">
      <img id="pimg" alt="">
      <div class="grow"><div id="ptitle" class="ptitle"></div><div id="pprice" class="small"></div></div>
    </div>
    <div id="groups"></div>
    <div class="gname" data-i18n="photo_label"></div>
    <div id="photos" class="photos"></div>
    <div class="mute small" data-i18n="photo_hint"></div>
    <button id="go" data-i18n="go"></button>
    <button class="ghost" id="stop" hidden data-i18n="stop"></button>
    <div class="mute small" data-i18n="variant_note"></div>
  </div>
</section>

<section id="run" hidden>
  <div class="stats">
    <div><div class="mute small" data-i18n="st_level"></div><div id="slevel" class="num">—</div></div>
    <div><div class="mute small" data-i18n="st_fatigue"></div><div id="sfat" class="num">—</div></div>
    <div><div class="mute small" data-i18n="st_seen"></div><div id="sseen" class="num">—</div></div>
    <div><div class="mute small" data-i18n="st_time"></div><div id="stime" class="num">—</div></div>
  </div>
  <div id="captcha" class="warn" hidden data-i18n="captcha_banner"></div>
  <div id="verdict"></div>
  <details><summary class="mute small" data-i18n="log_title"></summary><div id="log"></div></details>
</section>

<section id="results" hidden>
  <div id="list"></div>
</section>

<section id="mine" hidden>
  <h2 data-i18n="mine_h"></h2>
  <p class="mute small" data-i18n="mine_p"></p>
  <textarea id="minetext" placeholder="https://www.aliexpress.com/item/…"></textarea>
  <button class="ghost" id="cmp" data-i18n="cmp"></button>
</section>

<script type="module" src="panel.js"></script>
</body>
</html>
